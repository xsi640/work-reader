<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="一个 ChatGPT 界面风格的本地小说阅读器，支持导入 TXT、全文搜索、书签与朗读。" />
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('work-reader:settings') || '{}');
          var theme = saved.theme || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* 首屏主题初始化失败时使用默认浅色 */
        }
      })();
    </script>
    <title>Work Reader</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230d0d0d' stroke-width='1.6' stroke-linecap='round'%3E%3Cg transform='translate(12 12)'%3E%3Cpath d='M0 -1.6C2.4 -5.2 5.6 -6.4 7.3 -4.3 8.9 -2.3 7.6 .9 4.6 2.2'/%3E%3Cpath d='M0 -1.6C2.4 -5.2 5.6 -6.4 7.3 -4.3 8.9 -2.3 7.6 .9 4.6 2.2' transform='rotate(60)'/%3E%3Cpath d='M0 -1.6C2.4 -5.2 5.6 -6.4 7.3 -4.3 8.9 -2.3 7.6 .9 4.6 2.2' transform='rotate(120)'/%3E%3Cpath d='M0 -1.6C2.4 -5.2 5.6 -6.4 7.3 -4.3 8.9 -2.3 7.6 .9 4.6 2.2' transform='rotate(180)'/%3E%3Cpath d='M0 -1.6C2.4 -5.2 5.6 -6.4 7.3 -4.3 8.9 -2.3 7.6 .9 4.6 2.2' transform='rotate(240)'/%3E%3Cpath d='M0 -1.6C2.4 -5.2 5.6 -6.4 7.3 -4.3 8.9 -2.3 7.6 .9 4.6 2.2' transform='rotate(300)'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
